<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Molngolf – scene test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; }
    #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #stat {
      position: fixed; left: 10px; top: 10px; padding: 5px 9px; border-radius: 8px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #fff; background: rgba(10, 18, 44, 0.62); white-space: pre; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="stat"></div>
  <script type="module">
    // Fake minigolf for judging the scene without the game server.
    //   ?host=1   host camera (spectator, right 31 % kept free)     ?lobby=1   host lobby framing
    //   ?n=8      ball count (1..40)     ?c=2   start course     ?q=low|medium|high     ?auto=1   ball 0 plays itself
    // Drag anywhere (pull back like a slingshot) to shoot ball 0. Keys 0-9 switch course.
    import { createScene } from '/js/scene.js';
    import { GOLF, BALL, COURSES, createBall, placeBall, canShoot, shoot, stepBall, teeSpot } from '/shared/golf.js';
    import { GAME, PHASE } from '/shared/protocol.js';

    const params = new URLSearchParams(location.search);
    const host = params.get('host') === '1';
    const N = Math.max(1, Math.min(40, parseInt(params.get('n'), 10) || 8));
    const auto0 = host || params.get('auto') === '1';
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const canvas = document.getElementById('c');
    const scene = createScene(canvas, { spectator: host });
    window.__scene = scene;
    if (params.get('q')) scene.setQuality(params.get('q'));

    const NAMES = ['Astrid', 'Björn', 'Cilla', 'Dag', 'Ebba', 'Folke', 'Greta', 'Hugo', 'Ines', 'Jarl', 'Kajsa', 'Love', 'Maja', 'Nils',
      'Olle', 'Pia', 'Runa', 'Sixten', 'Tyra', 'Ulf', 'Vera', 'Åke', 'Saga', 'Tove', 'Elsa', 'Alva', 'Axel', 'Liv', 'Sven', 'Örjan'];
    scene.setCourse(-5);            // odd input must not throw
    scene.fx.putt(999, 0.5);

    let ci = clamp(parseInt(params.get('c'), 10) || 0, 0, COURSES.length - 1);
    const balls = [];
    for (let i = 0; i < N; i++) {
      const b = createBall(i);
      b.strokes = 0; b.wait = 1 + Math.random() * 2.5; b.err = 0.04 + Math.random() * 0.14; b.holedT = 0;
      balls.push(b);
      scene.upsertPlayer(i, { name: i === 0 && !host ? 'Du' : NAMES[i % NAMES.length], color: i, isMe: i === 0 && !host, bot: i > 0 });
    }
    let ht = 0;
    function startCourse(k) {
      if (!COURSES[k]) return;
      ci = k; ht = 0;
      scene.setCourse(ci);
      balls.forEach((b, i) => { const [x, y] = teeSpot(COURSES[ci], i); placeBall(b, x, y); b.strokes = 0; b.wait = 1.2 + Math.random() * 2; });
    }
    scene.setGame(GAME.GOLF);
    startCourse(ci);

    // ---- bots putt along course.line
    function botShot(b) {
      const c = COURSES[ci], line = c.line && c.line.length ? c.line : [c.tee, c.cup];
      let best = 0, bd = Infinity;
      line.forEach((p, i) => { const d = Math.hypot(p[0] - b.x, p[1] - b.y); if (d < bd) { bd = d; best = i; } });
      const tgt = bd < 1.5 || best === 0 ? line[Math.min(best + 1, line.length - 1)] : line[best];
      const dx = tgt[0] - b.x, dy = tgt[1] - b.y, dist = Math.hypot(dx, dy) || 1;
      const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2 * b.err;
      const v = Math.sqrt(2 * GOLF.FRICTION * dist) * (1.25 + dist * 0.02) * (0.8 + Math.random() * 0.45);
      const p = shoot(b, Math.cos(ang) * v, Math.sin(ang) * v);
      if (p >= 0) { b.strokes++; scene.fx.putt(b.id, p); }
    }

    // ---- ball 0: drag to aim (slingshot), via scene.groundPoint
    let drag = null, aim = null;
    canvas.addEventListener('pointerdown', (e) => {
      const g = scene.groundPoint(e.clientX, e.clientY);
      if (!g || host) return;
      drag = { x: g.x, y: g.y, id: e.pointerId };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const g = scene.groundPoint(e.clientX, e.clientY);
      if (!g) return;
      const dx = drag.x - g.x, dy = drag.y - g.y, len = Math.hypot(dx, dy);
      aim = len > 0.15 ? { x: dx / len, y: dy / len, power: clamp(len / 5, 0, 1) } : null;
    });
    const release = () => {
      if (drag && aim && canShoot(balls[0])) {
        const v = GOLF.MIN_POWER + aim.power * (GOLF.MAX_POWER - GOLF.MIN_POWER);
        const p = shoot(balls[0], aim.x * v, aim.y * v);
        if (p >= 0) { balls[0].strokes++; scene.fx.putt(0, p); }
      }
      drag = null; aim = null;
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key)) startCourse(+e.key); });

    // ---- loop
    const STEP = 1 / 60, events = [];
    let acc = 0, last = performance.now(), time = 0;
    const stat = document.getElementById('stat');
    let statT = 0;
    window.__h = { balls, get ci() { return ci; }, startCourse, setAim(a) { aim = a; } };

    function simStep() {
      const c = COURSES[ci];
      for (const b of balls) {
        if (b.holed) {
          if ((b.holedT += STEP) > GOLF.RESPAWN_T) { b.holedT = 0; const [x, y] = teeSpot(c, b.id); placeBall(b, x, y); b.strokes = 0; }
          continue;
        }
        if ((b.id > 0 || auto0) && canShoot(b) && (b.wait -= STEP) <= 0) { botShot(b); b.wait = 0.8 + Math.random() * 2.2; }
        stepBall(b, c, ht, STEP, events);
      }
      for (const ev of events) {
        if (ev[0] === 'bounce') scene.fx.bounce(ev[1], ev[2], ev[3], ev[4]);
        else if (ev[0] === 'boost') scene.fx.boost(ev[1]);
        else if (ev[0] === 'holed') scene.fx.holed(ev[1], balls[ev[1]].strokes);
        else if (ev[0] === 'oob') scene.fx.oob(ev[1]);
      }
      events.length = 0;
      ht += STEP;
    }

    function tick(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now; time += dt; acc += dt;
      while (acc >= STEP) { simStep(); acc -= STEP; }
      const view = {
        time, game: GAME.GOLF, phase: host && params.get('lobby') === '1' ? PHASE.LOBBY : PHASE.PLAYING,
        myId: host ? null : 0, spectate: host, course: ci, holeTime: ht,
        balls: balls.map((b) => ({ id: b.id, x: b.x, y: b.y, z: b.z, strokes: b.strokes,
          st: (b.moving ? BALL.MOVING : 0) | (b.holed ? BALL.HOLED : 0) | (b.falling ? BALL.FALLING : 0) })),
        aim: !host && canShoot(balls[0]) ? aim : null,
      };
      scene.frame(dt, view);
      if ((statT += dt) > 0.5) {
        statT = 0;
        const s = scene.getStats();
        stat.textContent = `${COURSES[ci].name} (${ci}/${COURSES.length - 1})  par ${COURSES[ci].par}\nfps ${s.fps}  ${s.quality}\nslag ${balls[0].strokes}  · dra för att slå · 0-9 bana`;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
